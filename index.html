<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mind Map Tool</title>
    <link rel="stylesheet" href="v2/style.css" />
    <link rel="stylesheet" href="v2/core/modular-framework.css" />
    <link rel="stylesheet" href="v2/ui/node-creator.css" />
</head>
<body>
<!-- ‼️ Top‑bar controls -->
<div id="controls">
    <button id="loadCodeBtn">Load Code</button>
    <input type="file" id="codeFileInput" webkitdirectory multiple style="display: none;" />
    <button id="clearBtn">Clear Map</button>
    <button id="exportBtn">Export Map</button>
    <input type="file" id="importInput" />

    <!-- Undo/Redo buttons -->
    <span class="toolbar-separator"></span>
    <button id="undoBtn" class="toolbar-btn" title="Undo (Ctrl+Z)" disabled>↩ Undo</button>
    <button id="redoBtn" class="toolbar-btn" title="Redo (Ctrl+Y)" disabled>↪ Redo</button>

    <!-- Mode tabs -->
    <div id="mode-tabs" class="mode-tabs">
        <button id="hierarchical-tab" class="mode-tab active">Hierarchical</button>
        <button id="flow-tab" class="mode-tab">Flow Mode</button>
        <button id="notes-tab" class="mode-tab">Notes</button>
    </div>

    <!-- Flow mode controls (hidden by default) -->
    <div id="flow-controls" class="flow-controls" style="display: none;">
        <span id="flow-mode-indicator"></span>
        <div class="flow-path-input-container">
            <input type="text" id="flow-path-input" placeholder="path/to/file.js" />
            <button id="flow-path-go-btn">Go</button>
            <button id="flow-back-btn" style="display: none;">Back</button>
        </div>
        <button id="clear-trace-btn" style="display: none;">Clear</button>
    </div>

    <!-- Breadcrumb trail will be populated here by JS → keeps it *below* the buttons -->
    <span id="breadcrumb"></span>

    <!-- Right-side toolbar items -->
    <div class="toolbar-right">
        <button id="theme-toggle-btn" class="toolbar-btn" title="Toggle theme (T)"></button>
        <button id="settings-btn" class="toolbar-btn" title="Settings (,)">&#9881;</button>
        <button id="help-btn" class="toolbar-btn" title="Keyboard shortcuts (?)">?</button>
    </div>
</div>

<!-- Main content area -->
<div id="main-content">
    <!-- Main drawing surface -->
    <div id="canvas"></div>
    <svg id="connections"></svg>

    <!-- Attributes panel -->
    <div id="attributes-panel">
        <div class="panel-header">
            <button id="close-attributes" class="close-btn">×</button>
        </div>

        <div id="attributes-list"></div>

        <form id="add-attribute-form">
            <h4>Add New Attribute</h4>
            <div class="form-row">
                <input type="text" id="attribute-name" placeholder="Attribute name" required />
                <select id="attribute-type">
                    <option value="string">String</option>
                    <option value="integer">Integer</option>
                    <option value="float">Float</option>
                </select>
            </div>
            <div class="form-row">
                <input type="text" id="attribute-value" placeholder="Value" />
                <button type="submit">Add</button>
            </div>
        </form>
    </div>
</div>

<script type="module" src="v2/main.js"></script>
</body>
</html>
